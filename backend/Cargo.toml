[package]
name = "budlum-explorer-api"
version = "0.1.0"
edition = "2021"
description = "budlum.xyz explorer/wallet website backend (Rust). Seeded data now, indexer-ready via ExplorerRepository trait."
license = "MIT"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
async-trait = "0.1"
# Budlum node JSON-RPC istemcisi (HTTP). rustls — sistem openssl gerekmez.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
